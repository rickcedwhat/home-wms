<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF-SMART Code Studio</title>
  <link rel="stylesheet" href="/code.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Prism.js Syntax Highlighting CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
</head>
<body>
  <div class="ide-container">
    <!-- Top Navigation Bar -->
    <header class="ide-header">
      <div class="header-left">
        <div class="brand-group">
          <span class="brand-box">RF</span>
          <span class="brand-title">Code Studio</span>
        </div>
        <div class="nav-history">
          <button class="btn-hist font-mono" id="btnNavBack" title="Navigate Back" disabled>&larr;</button>
          <button class="btn-hist font-mono" id="btnNavForward" title="Navigate Forward" disabled>&rarr;</button>
        </div>
        <span class="crumb-text font-mono" id="breadcrumbDisplay">RFSmart</span>
        <span class="cmd-click-badge font-mono">⌘-Click to navigate</span>
      </div>

      <div class="header-right">
        <button class="btn-top" id="copyCodeBtn" title="Copy code">📋 Copy</button>
        <button class="btn-top" id="togglePlaygroundBtn" title="Live API Console">⚡ Test API</button>
        <a href="/" target="_blank" class="btn-top btn-launch" title="Open Mobile Scanner in side window">
          📱 Scanner UI &nearr;
        </a>
      </div>
    </header>

    <!-- Definition Hover Tooltip -->
    <div id="defTooltip" class="def-tooltip font-mono">
      <span class="tooltip-action">⌘+Click</span> to jump to <span id="tooltipTarget" class="tooltip-target"></span>
    </div>

    <!-- Workspace -->
    <div class="ide-workspace">
      <!-- Minimalist File Explorer -->
      <aside class="ide-sidebar">
        <div class="sidebar-top">
          <span class="sidebar-heading">EXPLORER</span>
          <span class="file-count font-mono" id="filesCountBadge">0 files</span>
        </div>

        <div class="filter-box">
          <input type="text" id="fileSearchInput" placeholder="Filter files..." autocomplete="off" />
        </div>

        <div class="tree-list" id="fileTreeContainer">
          <!-- Dynamically populated via code.js -->
        </div>
      </aside>

      <!-- Clean Editor Area -->
      <main class="ide-editor-area">
        <!-- Tabs Bar -->
        <div class="editor-tabs" id="editorTabsBar">
          <!-- Open tabs -->
        </div>

        <!-- 1-Line Info Strip -->
        <div class="file-info-strip" id="fileInfoStrip">
          <span class="info-layer font-mono" id="contextLayerBadge">MIDDLEWARE</span>
          <span class="info-desc" id="contextFileDesc">Loading...</span>
        </div>

        <!-- Code Viewer with Line Numbers -->
        <div class="editor-viewport">
          <div class="loading-veil" id="loadingOverlay">
            <div class="spinner"></div>
          </div>
          <pre class="line-numbers"><code id="codeViewer" class="language-javascript">// Loading file...</code></pre>
        </div>

        <!-- Collapsible API Test Console (Collapsed by default) -->
        <div class="playground-drawer collapsed" id="playgroundDrawer">
          <div class="drawer-bar" id="drawerBar">
            <div class="drawer-title font-mono">
              <span class="dot-green"></span>
              <span>Live Test Console (Port 7370)</span>
            </div>
            <button class="drawer-toggle-btn" id="closeDrawerBtn">&times;</button>
          </div>

          <div class="drawer-body">
            <div class="drawer-controls">
              <div class="input-inline">
                <input type="text" id="testBarcodeInput" value="SKU-1001" placeholder="Enter barcode..." class="font-mono" />
                <button class="btn-run" id="runLookupTestBtn">Run Lookup</button>
              </div>

              <div class="quick-chips">
                <button class="chip font-mono" data-barcode="SKU-1001">SKU-1001</button>
                <button class="chip font-mono" data-barcode="SKU-1002">SKU-1002</button>
                <button class="chip font-mono" data-barcode="(01)00012345678901(30)5">GS1 AI</button>
                <button class="chip font-mono" data-barcode="INVALID-999">404 Test</button>
              </div>
            </div>

            <div class="drawer-output">
              <div class="output-status-line">
                <span class="status-chip font-mono" id="resStatusBadge">IDLE</span>
                <span class="latency-text font-mono" id="resLatencyDisplay">Latency: --</span>
                <span class="tba-text font-mono" id="resTbaDisplay">TBA: --</span>
              </div>
              <pre class="output-text font-mono" id="resBodyDisplay">// Click "Run Lookup" to inspect live response</pre>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Prism.js Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <script src="/code.js"></script>
</body>
</html>
